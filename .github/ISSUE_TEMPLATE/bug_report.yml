name: Bug report
description: Report reproducible incorrect behavior
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, or private logs. Report vulnerabilities through the Security Policy.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.20.0
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Output format
      options:
        - single-file
        - directory
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe Markdown source and the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the structured diagnostic output if the build failed.
    validations:
      required: true

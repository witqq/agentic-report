name: E2E (nightly)

# Browser coverage is diagnostic and does not block pull requests or releases.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser E2E and timed checks (pnpm test:e2e, pnpm test:perf)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0

      - name: Enable the pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: pnpm test:e2e

      # Testfold writes one test-results/summary.json per run, so the perf run would replace the E2E one;
      # each suite's summary is kept under its own name for the uploaded artifact.
      - name: Keep the E2E summary
        if: always()
        run: if [ -f test-results/summary.json ]; then cp test-results/summary.json test-results/summary-e2e.json; fi

      # Timed budgets run alone, after the browser suite, so no other test shares the CPU.
      - name: Run timed performance checks
        if: always()
        run: pnpm test:perf

      - name: Keep the perf summary
        if: always()
        run: if [ -f test-results/summary.json ]; then cp test-results/summary.json test-results/summary-perf.json; fi

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

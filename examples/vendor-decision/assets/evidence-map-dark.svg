<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Vendor decision evidence map</title>
  <desc id="desc">A sample governance flow from fixed requirements through dated vendor evidence, hard gates, weighted scoring, and a conditional pilot decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d142d"/>
      <stop offset="1" stop-color="#140c28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#96a4d6" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5a679d"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="36" fill="url(#bg)"/>
  <text x="70" y="78" fill="#9eabdc" font-family="Inter, system-ui, sans-serif" font-size="31" font-weight="750">Evidence before preference</text>
  <text x="70" y="116" fill="#6a759c" font-family="Inter, system-ui, sans-serif" font-size="18">Fixed constraints prevent a polished score from hiding an ineligible candidate.</text>
  <g fill="none" stroke="#5a679d" stroke-width="5" marker-end="url(#arrow)">
    <path d="M264 300h72"/>
    <path d="M534 300h72"/>
    <path d="M804 300h72"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <g>
      <rect x="64" y="198" width="200" height="204" rx="25" fill="#161616" stroke="#303e74" stroke-width="2"/>
      <circle cx="164" cy="258" r="28" fill="#111939"/>
      <path d="M150 258l10 10 21-25" fill="none" stroke="#3853c4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="164" y="330" text-anchor="middle" fill="#97a5d5" font-size="20" font-weight="700">Requirements</text>
      <text x="164" y="362" text-anchor="middle" fill="#677298" font-size="15">fixed before bids</text>
    </g>
    <g>
      <rect x="334" y="198" width="200" height="204" rx="25" fill="#161616" stroke="#303e74" stroke-width="2"/>
      <path d="M405 236h58l24 24v76h-82z" fill="#161a2d" stroke="#4c5ca1" stroke-width="4"/>
      <path d="M426 286h40M426 309h32" stroke="#4c5ca1" stroke-width="6" stroke-linecap="round"/>
      <text x="434" y="362" text-anchor="middle" fill="#97a5d5" font-size="20" font-weight="700">Dated evidence</text>
    </g>
    <g>
      <rect x="604" y="198" width="200" height="204" rx="25" fill="#97a5d4" stroke="#3853c4" stroke-width="3"/>
      <path d="M665 270h78M704 231v78" stroke="#a77d08" stroke-width="10" stroke-linecap="round"/>
      <text x="704" y="350" text-anchor="middle" fill="#161616" font-size="20" font-weight="700">Hard gates</text>
      <text x="704" y="379" text-anchor="middle" fill="#1f2642" font-size="15">pass before scoring</text>
    </g>
    <g>
      <rect x="874" y="198" width="262" height="204" rx="25" fill="#3853c4" stroke="#97a5d4" stroke-width="3"/>
      <rect x="918" y="246" width="30" height="70" rx="7" fill="#141d45"/>
      <rect x="961" y="226" width="30" height="90" rx="7" fill="#a77d08"/>
      <rect x="1004" y="263" width="30" height="53" rx="7" fill="#101739"/>
      <path d="M1058 249l18 18 30-38" fill="none" stroke="#161616" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1005" y="350" text-anchor="middle" fill="#161616" font-size="20" font-weight="700">Score + conditions</text>
      <text x="1005" y="379" text-anchor="middle" fill="#0f1433" font-size="15">reversible pilot decision</text>
    </g>
  </g>
  <rect x="70" y="466" width="1060" height="4" rx="2" fill="#24293b"/>
  <rect x="70" y="466" width="720" height="4" rx="2" fill="#3853c4"/>
  <text x="70" y="508" fill="#6a759c" font-family="Inter, system-ui, sans-serif" font-size="15">mandatory evidence path</text>
  <text x="948" y="508" fill="#6a759c" font-family="Inter, system-ui, sans-serif" font-size="15">preference applies last</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Общее основание компоновок</title><desc id="desc">Документ, панель, лендинг и смешанная компоновка подключены к одному основанию токенов.</desc><rect width="960" height="420" rx="28" fill="#ecfdf9"/><g font-family="system-ui,sans-serif" font-size="22" text-anchor="middle" fill="#172033"><rect x="70" y="55" width="180" height="90" rx="18" fill="#fff"/><text x="160" y="108">Документ</text><rect x="285" y="55" width="180" height="90" rx="18" fill="#fff"/><text x="375" y="108">Панель</text><rect x="500" y="55" width="180" height="90" rx="18" fill="#fff"/><text x="590" y="108">Лендинг</text><rect x="715" y="55" width="180" height="90" rx="18" fill="#fff"/><text x="805" y="108">Смешанная</text><path d="M160 145v70M375 145v70M590 145v70M805 145v70M160 215h645" stroke="#087f75" stroke-width="6"/><path d="M480 215v55" stroke="#087f75" stroke-width="6"/><rect x="300" y="270" width="360" height="95" rx="22" fill="#087f75"/><text x="480" y="312" fill="#fff">Общие токены</text><text x="480" y="340" fill="#fff">и примитивы</text></g></svg>

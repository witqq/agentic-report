<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Bounded beta learning loop</title>
  <desc id="desc">A fictional product launch path from a bounded audience through collaborative value and measured evidence to a governed rollout decision.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142e26"/>
      <stop offset="1" stop-color="#0c182a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a6e4e4" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#79b3b2"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="38" fill="url(#background)"/>
  <text x="70" y="76" fill="#ace0e9" font-family="Inter, system-ui, sans-serif" font-size="31" font-weight="750">Learn inside a boundary</text>
  <text x="70" y="116" fill="#86a5a9" font-family="Inter, system-ui, sans-serif" font-size="18">Each expansion follows evidence; no metric can bypass a mandatory launch gate.</text>
  <g fill="none" stroke="#79b3b2" stroke-width="5" marker-end="url(#arrow)">
    <path d="M280 297h58"/>
    <path d="M552 297h58"/>
    <path d="M824 297h58"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <g>
      <rect x="62" y="190" width="218" height="214" rx="28" fill="#161616" stroke="#3c7d76" stroke-width="2"/>
      <circle cx="171" cy="257" r="39" fill="#1e3830"/>
      <circle cx="154" cy="253" r="12" fill="#70e8df"/>
      <circle cx="187" cy="253" r="12" fill="#57beb6"/>
      <path d="M135 292c9-22 63-22 72 0" fill="none" stroke="#70e8df" stroke-width="10" stroke-linecap="round"/>
      <text x="171" y="342" text-anchor="middle" fill="#aadae3" font-size="20" font-weight="700">Bounded audience</text>
      <text x="171" y="373" text-anchor="middle" fill="#7e999c" font-size="15">240 invited teams</text>
    </g>
    <g>
      <rect x="334" y="190" width="218" height="214" rx="28" fill="#161616" stroke="#3c7d76" stroke-width="2"/>
      <rect x="387" y="226" width="112" height="82" rx="18" fill="#1e3830"/>
      <path d="M413 252h61M413 276h42" stroke="#70e8df" stroke-width="8" stroke-linecap="round"/>
      <path d="M430 308l13 19 16-19" fill="#1e3830" stroke="#70e8df" stroke-width="5" stroke-linejoin="round"/>
      <text x="443" y="342" text-anchor="middle" fill="#aadae3" font-size="20" font-weight="700">Collaborative value</text>
      <text x="443" y="373" text-anchor="middle" fill="#7e999c" font-size="15">one owned decision</text>
    </g>
    <g>
      <rect x="606" y="190" width="218" height="214" rx="28" fill="#161616" stroke="#3c7d76" stroke-width="2"/>
      <path d="M657 300l31-38 28 21 44-56" fill="none" stroke="#70e8df" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="657" cy="300" r="8" fill="#70e8df"/>
      <circle cx="688" cy="262" r="8" fill="#70e8df"/>
      <circle cx="716" cy="283" r="8" fill="#70e8df"/>
      <circle cx="760" cy="227" r="8" fill="#70e8df"/>
      <text x="715" y="342" text-anchor="middle" fill="#aadae3" font-size="20" font-weight="700">Measured evidence</text>
      <text x="715" y="373" text-anchor="middle" fill="#7e999c" font-size="15">activation + retention</text>
    </g>
    <g>
      <rect x="878" y="190" width="260" height="214" rx="28" fill="#86ebe7" stroke="#9eefed" stroke-width="3"/>
      <path d="M942 264l27 27 55-69" fill="none" stroke="#161616" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1043 239h43M1043 266h43M1043 293h32" stroke="#264b42" stroke-width="8" stroke-linecap="round"/>
      <text x="1008" y="342" text-anchor="middle" fill="#161616" font-size="20" font-weight="700">Governed rollout</text>
      <text x="1008" y="373" text-anchor="middle" fill="#1d3932" font-size="15">expand or hold</text>
    </g>
  </g>
  <path d="M1010 438c-180 88-635 88-838 0" fill="none" stroke="#3c7d76" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <text x="590" y="512" text-anchor="middle" fill="#86a5a9" font-family="Inter, system-ui, sans-serif" font-size="16">A hold returns the team to evidence, not to a wider launch.</text>
</svg>

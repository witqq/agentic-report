<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Многоуровневая модель страницы</title><desc id="desc">Исходник проходит проверку и смысловой рендеринг, превращаясь в статический браузерный артефакт.</desc><rect width="960" height="360" rx="28" fill="#c7d1e6"/><g font-family="system-ui,sans-serif" font-size="24" text-anchor="middle"><rect x="55" y="115" width="220" height="130" rx="18" fill="#0e1631"/><text x="165" y="172" fill="#bdc8e1">Декларативный</text><text x="165" y="207" fill="#bdc8e1">исходник</text><rect x="370" y="115" width="220" height="130" rx="18" fill="#2847cd"/><text x="480" y="172" fill="#161616">Модель страницы</text><text x="480" y="207" fill="#161616">+ токены</text><rect x="685" y="115" width="220" height="130" rx="18" fill="#1a332f"/><text x="795" y="172" fill="#bdc8e1">Переносимый</text><text x="795" y="207" fill="#bdc8e1">артефакт</text><path d="M275 180h95M590 180h95" stroke="#001e89" stroke-width="8"/></g></svg>

kind: block
name: product-theatre
description: A product run replayed second by second as the reader scrolls, with the whole run as a table after it.
staticEquivalent: The diagram of the product's panels drawn complete, every step with its second and its text in the flow of the page, and the table of the whole run; print shows the same.
forms: [leaf]
attributes:
  title:
    type: string
    required: true
    maxLength: 200
    description: The title of the section that holds the run.
  id:
    type: string
    required: true
    maxLength: 64
    description: The anchor of the section.
  nav:
    type: string
    required: true
    maxLength: 40
    description: The short label the reader navigates by.
  scenario:
    type: string
    required: true
    maxLength: 64
    description: The name of the page data file that holds the scenario, without .json (the page declares the file in its data field).
template: template.md
examples: [example-cli.md, example-dashboard.md]
